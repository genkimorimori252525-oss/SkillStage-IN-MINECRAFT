name: CI

on:
  push:
    branches:
      - main
      - 'jolly/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run tests
        run: gradle --no-daemon test

  forge1201-runtime-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build Forge 1.20.1 runtime mod
        run: gradle --no-daemon -p minecraft/forge1201-runtime build
      - name: Write runtime JAR SHA-256
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find minecraft/forge1201-runtime/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | sort | head -n 1)"
          test -n "$jar"
          sha256sum "$jar" | tee "$jar.sha256"
      - name: Upload in-game acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: skillstage-vfx-runtime-forge1201
          path: |
            minecraft/forge1201-runtime/build/libs/*.jar
            minecraft/forge1201-runtime/build/libs/*.jar.sha256
          if-no-files-found: error
          retention-days: 14